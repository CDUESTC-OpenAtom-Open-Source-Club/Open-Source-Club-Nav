# deploy/docker-compose.prod.yml
# 生产环境 compose 文件，由 deploy.sh 驱动。
# 不要直接 docker compose up，应通过 deploy.sh 执行部署流程。

services:
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    env_file:
      - ./env/web.env
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:4000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      GIN_MODE: release
      CONFIG_PATH: /app/config.yaml
    volumes:
      - ./config/backend/config.local.yaml:/app/config.yaml:ro
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  mysql:
    image: mysql:8.0
    container_name: openatom-club-mysql
    restart: unless-stopped
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --table-open-cache=256
      - --thread-cache-size=8
    env_file:
      - ./env/mysql.env
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
