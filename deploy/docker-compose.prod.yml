# deploy/docker-compose.prod.yml
# 生产环境 compose 文件，由 deploy.sh 驱动。
# 不要直接 docker compose up，应通过 deploy.sh 执行部署流程。

services:
  web:
    image: ${WEB_IMAGE}
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_BACKEND_API_URL: http://backend:8080
    env_file:
      - ./env/web.env
    ports:
      - "4000:4000"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://127.0.0.1:4000/api/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 30s
    deploy:
      resources:
        limits:
          memory: 200M
          cpus: "1.0"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  backend:
    image: ${BACKEND_IMAGE}
    restart: unless-stopped
    environment:
      GIN_MODE: release
      CONFIG_PATH: /app/config.yaml
      DB_PATH: /app/data/app.db
    volumes:
      # 生产挂载：服务器上需要准备 ./config/backend/config.docker.yaml（DSN/JWT 等）
      - ./config/backend/config.docker.yaml:/app/config.yaml:ro
      # SQLite 数据持久化卷
      - backend-data:/app/data
    ports:
      - "8080:8080"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:8080/healthz"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s
    deploy:
      resources:
        limits:
          memory: 96M
          cpus: "0.5"
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  backend-data:
