services:
  web:
    build:
      context: ./fronted/apps/web
    image: openatom-club-nav-web:prod
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: "4000"
      HOSTNAME: 0.0.0.0
      NEXT_TELEMETRY_DISABLED: "1"
    ports:
      - "4000:4000"
    depends_on:
      mysql:
        condition: service_healthy

  backend:
    build:
      context: ./backend
    image: openatom-club-nav-backend:prod
    restart: unless-stopped
    environment:
      GIN_MODE: release
      CONFIG_PATH: /app/config.yaml
    ports:
      - "8080:8080"
    volumes:
      - ./backend/config.local.yaml:/app/config.yaml:ro
    depends_on:
      mysql:
        condition: service_healthy

  mysql:
    image: mysql:8.0
    container_name: openatom-club-nav-mysql
    restart: unless-stopped
    command:
      - --performance-schema=OFF
      - --innodb-buffer-pool-size=128M
      - --max-connections=50
      - --table-open-cache=256
      - --thread-cache-size=8
    environment:
      MYSQL_ROOT_PASSWORD: "openatom_dev_password"
      MYSQL_DATABASE: "test_db"
    ports:
      - "3306:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/001-init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD --silent"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  mysql-data:
