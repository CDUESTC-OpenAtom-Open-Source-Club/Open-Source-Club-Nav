# docker-compose.yml
# 容器化部署配置

services:
  # ── MySQL ─────────────────────────────────────────────────────────────────
  mysql:
    image: mysql:8.0
    container_name: openatom-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openatom_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_db}
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./backend/db/init.sql:/docker-entrypoint-initdb.d/init.sql
    networks:
      - openatom-net
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Redis ─────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: openatom-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - openatom-net
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Backend (Go) ──────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: openatom-backend
    restart: unless-stopped
    environment:
      MYSQL_HOST: mysql
      MYSQL_PORT: 3306
      MYSQL_USER: root
      MYSQL_PASSWORD: ${MYSQL_ROOT_PASSWORD:-openatom_dev_password}
      MYSQL_DATABASE: ${MYSQL_DATABASE:-test_db}
      JWT_SECRET: ${JWT_SECRET:-jwt-secret-123}
      JWT_EXPIRE: 3600
      CORS_ALLOWED_ORIGINS: "*"
      REDIS_ADDR: redis:6379
      REDIS_PASSWORD: ""
      REDIS_DB: 0
      GIN_MODE: release
    ports:
      - "8080:8080"
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - openatom-net

  # ── Frontend (Next.js) ────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend/apps/web
      dockerfile: Dockerfile
    container_name: openatom-frontend
    restart: unless-stopped
    environment:
      NEXT_PUBLIC_BACKEND_API_URL: http://backend:8080
      NEXT_PUBLIC_GITHUB_ORG: ${NEXT_PUBLIC_GITHUB_ORG:-openatom-club}
      GITHUB_TOKEN: ${GITHUB_TOKEN:-}
      ADMIN_BYPASS_LOGIN: ${ADMIN_BYPASS_LOGIN:-false}
    ports:
      - "4000:4000"
    depends_on:
      - backend
    networks:
      - openatom-net

# ── Volumes ───────────────────────────────────────────────────────────────────
volumes:
  mysql_data:
  redis_data:

# ── Networks ──────────────────────────────────────────────────────────────────
networks:
  openatom-net:
    driver: bridge
