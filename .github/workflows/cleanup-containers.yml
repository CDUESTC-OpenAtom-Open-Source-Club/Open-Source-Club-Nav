# .github/workflows/cleanup-containers.yml
# 清理生产服务器无用的 Docker 容器
name: Cleanup Containers

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  cleanup_production:
    name: Cleanup production containers
    runs-on: ubuntu-latest
    environment: production
    steps:
      - name: Configure SSH
        env:
          PROD_DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${PROD_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf '%s\n' "${PROD_DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Run cleanup script on production server
        env:
          PROD_DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          PROD_DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT }}
          PROD_DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${PROD_DEPLOY_PORT}" \
            "${PROD_DEPLOY_USER}@${PROD_DEPLOY_HOST}" \
            "DEPLOY_PATH='${PROD_DEPLOY_PATH}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd "${DEPLOY_PATH}"
          chmod +x deploy/cleanup-containers.sh
          ./deploy/cleanup-containers.sh
          REMOTE