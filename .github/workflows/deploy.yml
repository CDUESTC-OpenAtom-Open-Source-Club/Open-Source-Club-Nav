# .github/workflows/deploy.yml
# Build release artifacts in GitHub Actions, then deploy prebuilt files to the server.
name: Deploy Release Artifact

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    name: Build Linux artifact
    runs-on: ubuntu-latest
    outputs:
      release_tag: ${{ steps.release.outputs.release_tag }}
      artifact_name: ${{ steps.package.outputs.artifact_name }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve release tag
        id: release
        run: |
          RELEASE_TAG="${GITHUB_REF_NAME}"
          git rev-parse -q --verify "refs/tags/${RELEASE_TAG}" >/dev/null
          echo "release_tag=${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          echo "Deploying ${RELEASE_TAG}"

      - uses: actions/setup-go@v5
        with:
          go-version-file: backend/go.mod
          cache-dependency-path: backend/go.sum

      - name: Test backend
        working-directory: backend
        env:
          GOTOOLCHAIN: auto
          GOPROXY: https://goproxy.cn,direct
          GOFLAGS: -p=1
          GOMAXPROCS: "1"
        run: go test ./...

      - name: Build backend binary
        working-directory: backend
        env:
          GOTOOLCHAIN: auto
          GOPROXY: https://goproxy.cn,direct
          GOFLAGS: -p=1
          GOMAXPROCS: "1"
        run: bash scripts/build-linux.sh

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/apps/web/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend/apps/web
        run: npm ci

      - name: Build frontend standalone bundle
        working-directory: frontend/apps/web
        env:
          NEXT_TELEMETRY_DISABLED: "1"
        run: bash scripts/pack-standalone.sh dist

      - name: Package artifact
        id: package
        run: |
          RELEASE_TAG="${{ steps.release.outputs.release_tag }}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          ARTIFACT_NAME="openatom-${RELEASE_TAG}-${SHORT_SHA}"

          test -x backend/bin/openatom-backend-linux-amd64
          test -f frontend/apps/web/dist/server.js

          tar -czf "${ARTIFACT_NAME}.tar.gz" \
            deploy/update.sh \
            deploy/ecosystem.config.js \
            backend/config.yaml \
            backend/db/migrate \
            backend/bin/openatom-backend-linux-amd64 \
            frontend/apps/web/dist

          echo "artifact_name=${ARTIFACT_NAME}" >> "$GITHUB_OUTPUT"

      - uses: actions/upload-artifact@v4
        with:
          name: ${{ steps.package.outputs.artifact_name }}
          path: ${{ steps.package.outputs.artifact_name }}.tar.gz
          if-no-files-found: error
          retention-days: 14

  deploy_test:
    name: Deploy to test server
    needs: build
    if: ${{ endsWith(github.ref_name, '-test') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-test
      cancel-in-progress: false
    environment: test
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Configure SSH
        env:
          TEST_DEPLOY_SSH_KEY: ${{ secrets.TEST_DEPLOY_SSH_KEY }}
          TEST_SSH_KNOWN_HOSTS: ${{ secrets.TEST_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${TEST_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf '%s\n' "${TEST_DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload artifact
        env:
          TEST_DEPLOY_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
          TEST_DEPLOY_PORT: ${{ secrets.TEST_DEPLOY_PORT }}
          TEST_DEPLOY_USER: ${{ secrets.TEST_DEPLOY_USER }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          scp -i ~/.ssh/deploy_key -P "${TEST_DEPLOY_PORT}" \
            "${ARTIFACT_NAME}.tar.gz" \
            "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}:/tmp/${ARTIFACT_NAME}.tar.gz"

      - name: Apply artifact on test server
        env:
          TEST_DEPLOY_HOST: ${{ secrets.TEST_DEPLOY_HOST }}
          TEST_DEPLOY_PORT: ${{ secrets.TEST_DEPLOY_PORT }}
          TEST_DEPLOY_USER: ${{ secrets.TEST_DEPLOY_USER }}
          TEST_DEPLOY_PATH: ${{ secrets.TEST_DEPLOY_PATH }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${TEST_DEPLOY_PORT}" \
            "${TEST_DEPLOY_USER}@${TEST_DEPLOY_HOST}" \
            "DEPLOY_PATH='${TEST_DEPLOY_PATH}' RELEASE_TAG='${RELEASE_TAG}' ARTIFACT_NAME='${ARTIFACT_NAME}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd "${DEPLOY_PATH}"
          tar -xzf "/tmp/${ARTIFACT_NAME}.tar.gz" -C "${DEPLOY_PATH}"
          chmod +x backend/bin/openatom-backend-linux-amd64 deploy/update.sh

          SKIP_BACKEND_BUILD=1 \
          SKIP_FRONTEND_BUILD=1 \
          SKIP_GIT_CHECKOUT=1 \
          ./deploy/update.sh --tag "${RELEASE_TAG}"

          rm -f "/tmp/${ARTIFACT_NAME}.tar.gz"
          REMOTE

  deploy_production:
    name: Deploy to production server
    needs: build
    if: ${{ !endsWith(github.ref_name, '-test') }}
    runs-on: ubuntu-latest
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    environment: production
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: ${{ needs.build.outputs.artifact_name }}

      - name: Configure SSH
        env:
          PROD_DEPLOY_SSH_KEY: ${{ secrets.PROD_DEPLOY_SSH_KEY }}
          PROD_SSH_KNOWN_HOSTS: ${{ secrets.PROD_SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          chmod 700 ~/.ssh
          printf '%s\n' "${PROD_SSH_KNOWN_HOSTS}" > ~/.ssh/known_hosts
          printf '%s\n' "${PROD_DEPLOY_SSH_KEY}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key

      - name: Upload artifact
        env:
          PROD_DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          PROD_DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT }}
          PROD_DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
        run: |
          scp -i ~/.ssh/deploy_key -P "${PROD_DEPLOY_PORT}" \
            "${ARTIFACT_NAME}.tar.gz" \
            "${PROD_DEPLOY_USER}@${PROD_DEPLOY_HOST}:/tmp/${ARTIFACT_NAME}.tar.gz"

      - name: Apply artifact on production server
        env:
          PROD_DEPLOY_HOST: ${{ secrets.PROD_DEPLOY_HOST }}
          PROD_DEPLOY_PORT: ${{ secrets.PROD_DEPLOY_PORT }}
          PROD_DEPLOY_USER: ${{ secrets.PROD_DEPLOY_USER }}
          PROD_DEPLOY_PATH: ${{ secrets.PROD_DEPLOY_PATH }}
          PROD_LEGACY_SYSTEMD_SERVICES: ${{ secrets.PROD_LEGACY_SYSTEMD_SERVICES }}
          ARTIFACT_NAME: ${{ needs.build.outputs.artifact_name }}
          RELEASE_TAG: ${{ needs.build.outputs.release_tag }}
        run: |
          ssh -i ~/.ssh/deploy_key -p "${PROD_DEPLOY_PORT}" \
            "${PROD_DEPLOY_USER}@${PROD_DEPLOY_HOST}" \
            "DEPLOY_PATH='${PROD_DEPLOY_PATH}' RELEASE_TAG='${RELEASE_TAG}' ARTIFACT_NAME='${ARTIFACT_NAME}' LEGACY_SYSTEMD_SERVICES='${PROD_LEGACY_SYSTEMD_SERVICES}' bash -s" <<'REMOTE'
          set -Eeuo pipefail

          cd "${DEPLOY_PATH}"
          tar -xzf "/tmp/${ARTIFACT_NAME}.tar.gz" -C "${DEPLOY_PATH}"
          chmod +x backend/bin/openatom-backend-linux-amd64 deploy/update.sh

          active_legacy_services=""
          if [[ -n "${LEGACY_SYSTEMD_SERVICES:-}" ]]; then
            for service in ${LEGACY_SYSTEMD_SERVICES}; do
              if systemctl is-active --quiet "${service}"; then
                active_legacy_services="${active_legacy_services} ${service}"
              fi
            done
            systemctl stop ${LEGACY_SYSTEMD_SERVICES} 2>/dev/null || true
          fi

          if SKIP_BACKEND_BUILD=1 \
            SKIP_FRONTEND_BUILD=1 \
            SKIP_GIT_CHECKOUT=1 \
            ./deploy/update.sh --tag "${RELEASE_TAG}"; then
            if [[ -n "${LEGACY_SYSTEMD_SERVICES:-}" ]]; then
              systemctl disable ${LEGACY_SYSTEMD_SERVICES} 2>/dev/null || true
            fi
          else
            rc=$?
            if [[ -n "${active_legacy_services}" ]]; then
              systemctl start ${active_legacy_services} 2>/dev/null || true
            fi
            exit "${rc}"
          fi

          rm -f "/tmp/${ARTIFACT_NAME}.tar.gz"
          REMOTE
