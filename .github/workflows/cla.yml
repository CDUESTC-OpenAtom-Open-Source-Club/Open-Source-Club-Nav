name: CLA Assistant

on:
  issue_comment:
    types:
      - created
  pull_request_target:
    types:
      - opened
      - closed
      - synchronize
      - reopened

permissions:
  actions: write
  contents: write
  pull-requests: write
  statuses: write
  issues: write

jobs:
  cla:
    name: CLA Assistant
    runs-on: ubuntu-latest
    steps:
      - name: Check contributor license agreement
        if: github.event_name == 'pull_request_target' || github.event.comment.body == 'recheck' || github.event.comment.body == 'I have read the CLA Document and I hereby sign the CLA'
        uses: contributor-assistant/github-action@v2.6.1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          path-to-document: https://github.com/CDUESTC-OpenAtom-Open-Source-Club/Open-Source-Club-Nav/blob/main/CLA.md
          path-to-signatures: signatures/version1/cla.json
          branch: cla-signatures
          allowlist: dependabot[bot],github-actions[bot],renovate[bot]
          custom-pr-sign-comment: I have read the CLA Document and I hereby sign the CLA
          custom-notsigned-prcomment: "Thank you for your contribution. Please read the Contributor License Agreement at $pathToCLADocument and comment: I have read the CLA Document and I hereby sign the CLA"
          custom-allsigned-prcomment: All contributors have signed the CLA.
          lock-pullrequest-aftermerge: false
